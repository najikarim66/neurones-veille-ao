name: Download DCE on demand

on:
  workflow_dispatch:
    inputs:
      ref_consultation:
        description: "Reference consultation (ex: 994600)"
        required: true
        type: string
      org_acronyme:
        description: "Org acronyme (ex: q9t)"
        required: true
        type: string
      cosmos_doc_id:
        description: "Cosmos doc id (ex: veille_marchespublics_gov_ma_994600)"
        required: true
        type: string

jobs:
  download-dce:
    # 29/10/2026 : depuis les runners GitHub (hors Maroc), le portail ne sert plus le DCE
    # (telechargement jamais declenche, pages a 30 s), alors que le meme DCE se telecharge en
    # 40 s depuis le PC marocain. Meme runner que la veille ; un seul runner = des DCE
    # demandes ensemble passent l'un apres l'autre, sans etre annules.
    runs-on: [self-hosted, maroc]
    timeout-minutes: 15  # 3 tentatives + reprises etalees : voir DCE_TENTATIVE_MAX_S

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Runner self-hosted Windows : pas d'actions/setup-python (voir veille-ao.yml),
      # venv partage avec la veille.
      - name: Setup venv and install dependencies
        shell: powershell
        run: |
          $py = "C:\Users\naji\AppData\Local\Python\bin\python.exe"
          $venv = "C:\actions-runner\veille-venv"
          if (-not (Test-Path $venv)) { & $py -m venv $venv }
          & "$venv\Scripts\python.exe" -m pip install --upgrade pip
          & "$venv\Scripts\python.exe" -m pip install -r requirements.txt "azure-storage-blob>=12.19.0"

      - name: Install Playwright Chromium
        shell: powershell
        run: |
          & "C:\actions-runner\veille-venv\Scripts\python.exe" -m playwright install chromium

      - name: Download DCE + upload Blob + update Cosmos
        shell: powershell
        env:
          COSMOS_KEY: ${{ secrets.COSMOS_KEY }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_FROM: no-reply@neurones.ma
          GRAPH_FROM_NAME: Veille AO Neurones
          DCE_REF: ${{ inputs.ref_consultation }}
          DCE_ORG: ${{ inputs.org_acronyme }}
          DCE_DOC_ID: ${{ inputs.cosmos_doc_id }}
        run: |
          & "C:\actions-runner\veille-venv\Scripts\python.exe" -m src.dce_to_blob --ref "$env:DCE_REF" --org "$env:DCE_ORG" --doc-id "$env:DCE_DOC_ID"
